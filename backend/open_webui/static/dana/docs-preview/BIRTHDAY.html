<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css"/>
<link rel="stylesheet" href="/static/dana/dana.css"/>
<style>
:root {
  --dana-primary:#8F0046; --dana-bg:#8F0046; --dana-fg:#fff;
  --dana-glass-bg:rgba(255,255,255,.16); --dana-glass-border:rgba(255,255,255,.28);
  --dana-glass-blur:18px; --dana-font-sans:"Vazirmatn",ui-sans-serif,system-ui,sans-serif;
}
html,body { margin:0; background:linear-gradient(160deg,#8F0046,#5C002E); color:#fff;
  font-family:var(--dana-font-sans); letter-spacing:0; min-height:100%; }
.wrap { max-width:640px; margin:0 auto; padding:24px; }
.card { background:var(--dana-glass-bg); border:1px solid var(--dana-glass-border);
  backdrop-filter:blur(18px); border-radius:1rem; padding:1rem; }
h1 { font-size:1rem; margin:0 0 .75rem; opacity:.85; font-weight:600; }
</style>
</head>
<body><div class="wrap"><h1>BIRTHDAY</h1><div class="card" id="widget"><div class="dana-magic-root dana-birthday" dir="rtl">
  <div class="dana-birthday-cake" aria-hidden="true">🎂</div>
  <p style="margin:0;font-weight:650">تولدت مبارک!</p>
  <p style="margin:.25rem 0 0;opacity:.9;font-size:.9rem">ویجت جشن تولد دانا</p>
</div></div></div></body></html>
